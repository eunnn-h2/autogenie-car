# Put inside the server block, adjust /autogenie-car/ if installed in another subdirectory.
location ~* /(?:\.git|\.vscode|config|maintenance|deployment|private-backups)(?:/|$) { deny all; }
location ~* \.(?:sql|log|ini|env|bak)$ { deny all; }
# Set db-test.html as the index for the existing public entry point.
index db-test.html index.php index.html;

# Revalidate entry pages and code without changing the existing filenames.
# Apply before any general static-asset regex location in this server block.
location ~* \.(?:html|css|js)$ {
    expires off;
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
}
